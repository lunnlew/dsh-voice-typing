name: Publish to npm

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install espeak-ng (Linux local TTS fallback)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y espeak-ng

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 这里不再写 version：pnpm 版本只有一个来源 —— package.json 的 `packageManager`
        # 字段（批次 24，理由见 .github/workflows/ci.yml 同一处注释）。

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 同 ci.yml：`lib/` 已退出版本库，checkout 出来的工作树没有产物，
      # 「产物与源码同步」那条比对失去对象；`pnpm test` 自己会先构建两端。
      - name: Run tests
        run: pnpm test

  publish:
    name: Publish to npm
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 这里不再写 version：pnpm 版本只有一个来源 —— package.json 的 `packageManager`
        # 字段（批次 24，理由见 .github/workflows/ci.yml 同一处注释）。

      - name: Use Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 批次 23 之前这个 job 一步构建都没有：发布物 `lib/*.js` 是直接跟着 git 进来的。
      # 产物退出版本库之后必须在这里现生成 —— package.json 的 `prepack` 也会兜一遍
      # （实测 `npm pack` 与 `npm pack --dry-run` 都会执行 prepack），这里再显式加一步，
      # 是为了让「发布物里那四个产物是这次流水线建的」在日志里看得见，不靠生命周期隐式生效。
      - name: Build artifacts
        run: pnpm run build

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
